<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday Nour</title>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=Cormorant+Garamond:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
:root{--bg:#2b1810;--bg2:#4a2a1a;--cream:#f3e3cf;--gold:#d9a566;--heart:#a8552c;--heart2:#6b2f17;box-sizing:border-box}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:radial-gradient(circle at 50% 30%,var(--bg2),var(--bg) 70%);color:var(--cream);font-family:'Aref Ruqaa',Georgia,serif;overflow-x:hidden;padding-top:env(safe-area-inset-top,0);padding-bottom:env(safe-area-inset-bottom,0)}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;overflow-y:auto}
.screen.on{display:flex}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:clamp(28px,8vw,46px);line-height:1.25;color:var(--cream);margin-bottom:28px}
h1 b{display:block;font-size:1.5em;color:var(--gold);letter-spacing:.06em}
.heart{width:min(62vw,260px);cursor:pointer;animation:beat 1.4s ease-in-out infinite;filter:drop-shadow(0 12px 28px rgba(0,0,0,.5))}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.14)}30%{transform:scale(1)}45%{transform:scale(1.2)}70%{transform:scale(1)}}
.hint{margin-top:22px;font-size:18px;color:var(--gold);opacity:.85}
.float{position:fixed;bottom:-40px;pointer-events:none;color:var(--gold);opacity:.5;animation:up linear forwards}
@keyframes up{to{transform:translateY(-115vh) rotate(25deg);opacity:0}}
.photo{position:relative;width:min(82vw,340px);border-radius:180px 180px 24px 24px;overflow:hidden;border:3px solid var(--gold);box-shadow:0 18px 50px rgba(0,0,0,.55)}
.photo img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover}
.photo span{position:absolute;inset:auto 0 0 0;padding:70px 10px 16px;background:linear-gradient(transparent,rgba(43,24,16,.92));font-size:clamp(34px,10vw,50px);font-weight:700;color:#fff3e0}
.card{margin-top:26px;width:min(88vw,400px);padding:22px 20px;border:1px solid var(--gold);border-radius:18px;background:rgba(74,42,26,.55);animation:rise .9s ease both}
@keyframes rise{from{opacity:0;transform:translateY(20px)}}
.card small{display:block;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:22px;color:var(--gold);margin-bottom:12px}
.card p{font-size:clamp(20px,5.6vw,25px);line-height:2}
button{margin-top:20px;font:inherit;font-size:20px;color:var(--bg);background:var(--gold);border:0;border-radius:30px;padding:10px 30px;cursor:pointer}
#s3 .heart{animation:grow 2.2s ease-out forwards,beat 1.4s 2.2s ease-in-out infinite;width:min(80vw,340px)}
@keyframes grow{from{transform:scale(.1);opacity:0}to{transform:scale(1);opacity:1}}
.big{margin-top:26px;font-size:clamp(30px,9vw,48px);line-height:1.6;color:#fff3e0;animation:rise 1.4s 1.6s ease both}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>
